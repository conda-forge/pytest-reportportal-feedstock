schema_version: 1

context:
  name: pytest-reportportal
  version: "5.6.13"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 14e17595befb9ea13102d1fe2d1b49cc37c5125e24b37d21ff9bd597eb15dadf

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=68.0.0
    - setuptools-scm
    - wheel ==0.46.2
  run:
    - python >=${{ python_min }}
    - reportportal-client ==5.7.12

tests:
  - python:
      imports:
        - pytest_reportportal
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Agent for Reporting results of tests to the Report Portal
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/reportportal/agent-python-pytest

extra:
  recipe-maintainers:
    - thewchan
