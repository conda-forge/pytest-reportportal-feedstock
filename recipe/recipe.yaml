schema_version: 1

context:
  name: pytest-reportportal
  version: "5.6.12"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: fd65d2e10032dcb05e71d73b34d5e567299ae771b22986b57c9cba2c2d063c78

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=68.0.0
    - setuptools-scm
    - wheel ==0.46.2
  run:
    - python >=${{ python_min }}
    - reportportal-client ==5.7.10

tests:
  - python:
      imports:
        - pytest_reportportal
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Agent for Reporting results of tests to the Report Portal
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/reportportal/agent-python-pytest

extra:
  recipe-maintainers:
    - thewchan
